<!doctype html>
<!-- site/og-image.png, the preview in link cards (LinkedIn, Slack, messengers): 1200 × 630.
     Open this file in a browser at exactly that size and take a screenshot, e.g. with Playwright:
     page.set_viewport_size({"width": 1200, "height": 630}); page.goto("file://…/og.html"); page.screenshot(path="og-image.png")
     Text as in the hero, the monogram in ink on the right, as tall as the text block (cap height of the name to the
     prompt: 274 px), the two centred on the card. 72 px margins; between text and monogram 57 px, above its clear space. -->
<html lang="en"><head><meta charset="utf-8"><title>og-image</title><style>
@font-face { font-family: A; src: url("../../../site/assets/fonts/atkinson-hyperlegible-latin-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: A; src: url("../../../site/assets/fonts/atkinson-hyperlegible-latin-700-normal.woff2"); font-weight: 700; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #F7F6F3; color: #1A1C1E; font-family: A; position: relative; overflow: hidden; }
.t { position: absolute; left: 72px; top: 164px; }
h1 { margin: 0 0 26px; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: 0.055em; text-transform: uppercase; }
.tag { margin: 0 0 8px; font-size: 40px; line-height: 1.25; }
.claim { margin: 0 0 44px; font-size: 30px; line-height: 1.3; color: #565B60; }
.prompt { margin: 0; font-size: 27px; }
.caret { color: #7A1A2C; font-weight: 700; margin-right: 0.45em; }
.mark { position: absolute; right: 72px; top: 178px; height: 274px; }
</style></head><body>
<div class="t"><h1>Peter Stieg</h1><p class="tag">Performance Marketing · Data Science</p><p class="claim">Marketing leadership with root access</p><p class="prompt"><span class="caret">&gt;_</span>sudo dream plan ship</p></div>
<img class="mark" src="../mark/ps-monogram-ink.svg" alt="">
</body></html>
